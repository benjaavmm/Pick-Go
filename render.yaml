# Publica Altiro en Render (https://render.com) desde este repositorio.
#
# Tal como está, usa el plan gratuito y arranca con datos de DEMOSTRACIÓN, que se pierden cada vez
# que el servicio se duerme. Sirve para mostrar la app, no para operar.
#
# Para operar de verdad (que las cuentas y los pedidos se conserven):
#   1. Cambia `plan: free` por `plan: starter` y quita el `#` de las líneas del bloque `disk`.
#   2. Quita el `#` de las variables ALTIRO_DB y ALTIRO_DEMO.
#   3. En el panel de Render define ALTIRO_OWNER_EMAIL y ALTIRO_OWNER_PASSWORD (tu cuenta de plataforma)
#      y ALTIRO_VAPID_SUBJECT (por ejemplo mailto:tu-correo@dominio.cl). No las escribas en este archivo.
#   4. Para cobrar en la app, define ALTIRO_PAYMENTS (simulado o mercadopago) y, con Mercado Pago,
#      ALTIRO_MP_ACCESS_TOKEN y ALTIRO_MP_WEBHOOK_SECRET.
#   5. Para el correo (recuperar contraseñas y avisos), define también ALTIRO_SMTP_URL, ALTIRO_MAIL_FROM
#      y ALTIRO_PUBLIC_URL (la dirección https://… que te da Render).
services:
  - type: web
    # El nombre del servicio se mantiene: cambiarlo haría que Render cree un servicio nuevo, sin los datos.
    # Las variables PICKGO_* que ya tengas definidas en Render siguen funcionando.
    name: pick-go
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: 1
      # - key: ALTIRO_DB
      #   value: /var/data/altiro.db
      # - key: ALTIRO_DEMO
      #   value: 0
      - key: ALTIRO_OWNER_EMAIL
        sync: false
      - key: ALTIRO_OWNER_PASSWORD
        sync: false
      - key: ALTIRO_PAYMENTS
        sync: false
      - key: ALTIRO_MP_ACCESS_TOKEN
        sync: false
      - key: ALTIRO_MP_WEBHOOK_SECRET
        sync: false
      - key: ALTIRO_SMTP_URL
        sync: false
      - key: ALTIRO_MAIL_FROM
        sync: false
      - key: ALTIRO_PUBLIC_URL
        sync: false
